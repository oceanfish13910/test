// 2. Google Apps Script (Code.gs) Template & Cloud Sync Utilities
//    提供完整一鍵複製的 Google Apps Script 程式碼與試算表前後端雙向同步函式
// ============================================================================
const GOOGLE_APPS_SCRIPT_CODE = `/**
 * 臺南一中 105 歲校慶國文科成果展｜一頁府城・百年書籤
 * Google 試算表雙向同步服務 (Code.gs)
 *
 * 部署步驟：
 * 1. 開啟任一 Google 試算表 → 上方選單「擴充功能」→「Apps Script」
 * 2. 將預設程式碼全選刪除，貼上本完整程式碼並儲存
 * 3. 點擊右上角「部署」→「新增部署」→ 類型選「網頁應用程式」
 *    - 執行身分：我 (您的 Google 帳號)
 *    - 誰可以存取：所有人 (確保學生從 Google 協作平台投稿可寫入)
 * 4. 複製產生的「網頁應用程式網址 (.../exec)」貼回教師後台即可連動！
 */

var SHEET_NAME = '書籤投稿資料';
var HEADERS = [
  'id',
  'createdAt',
  'studentInfo',
  'locationZone',
  'customZoneName',
  'landmarkLabel',
  'mapX',
  'mapY',
  'sideAText',
  'visualMode',
  'dotGrid',
  'interviewee',
  'sideBText',
  'imageDataUrl'
];

function getOrCreateSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(HEADERS);
    sheet.setFrozenRows(1);
  } else if (sheet.getLastRow() === 0) {
    sheet.appendRow(HEADERS);
    sheet.setFrozenRows(1);
  }
  return sheet;
}

function doGet(e) {
  try {
    var sheet = getOrCreateSheet_();
    var lastRow = sheet.getLastRow();
    var bookmarks = [];
    if (lastRow > 1) {
      var values = sheet.getRange(2, 1, lastRow - 1, HEADERS.length).getValues();
      for (var i = 0; i < values.length; i++) {
        var r = values[i];
        if (!r[0] && !r[2]) continue;
        bookmarks.push({
          id: String(r[0] || ('gs-' + i)),
          createdAt: Number(r[1]) || Date.now(),
          studentInfo: String(r[2] || ''),
          locationZone: String(r[3] || '臺南・府城舊城區'),
          customZoneName: String(r[4] || ''),
          landmarkLabel: String(r[5] || ''),
          mapCoords: {
            x: Number(r[6]) || 43.2,
            y: Number(r[7]) || 72.8
          },
          sideAText: String(r[8] || ''),
          visualMode: String(r[9] || 'blank-sketch'),
          dotGrid: r[10] === true || String(r[10]).toLowerCase() === 'true',
          interviewee: String(r[11] || ''),
          sideBText: String(r[12] || ''),
          imageDataUrl: String(r[13] || '')
        });
      }
    }
    return ContentService
      .createTextOutput(JSON.stringify({ status: 'ok', bookmarks: bookmarks.reverse() }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService
      .createTextOutput(JSON.stringify({ status: 'error', message: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function upsertBookmarkRow_(sheet, bm) {
  var lastRow = sheet.getLastRow();
  var targetRow = -1;
  if (lastRow > 1) {
    var ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
    for (var i = 0; i < ids.length; i++) {
      if (String(ids[i][0]) === String(bm.id)) {
        targetRow = i + 2;
        break;
      }
    }
  }
  var rowData = [
    String(bm.id || ('gs-' + new Date().getTime())),
    Number(bm.createdAt) || new Date().getTime(),
    String(bm.studentInfo || ''),
    String(bm.locationZone || ''),
    String(bm.customZoneName || ''),
    String(bm.landmarkLabel || ''),
    bm.mapCoords && bm.mapCoords.x ? Number(bm.mapCoords.x) : 43.2,
    bm.mapCoords && bm.mapCoords.y ? Number(bm.mapCoords.y) : 72.8,
    String(bm.sideAText || ''),
    String(bm.visualMode || 'blank-sketch'),
    Boolean(bm.dotGrid),
    String(bm.interviewee || ''),
    String(bm.sideBText || ''),
    String(bm.imageDataUrl || '').slice(0, 48000)
  ];
  if (targetRow > 0) {
    sheet.getRange(targetRow, 1, 1, HEADERS.length).setValues([rowData]);
  } else {
    sheet.appendRow(rowData);
  }
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.tryLock(10000);
  try {
    var sheet = getOrCreateSheet_();
    var raw = e && e.postData && e.postData.contents ? e.postData.contents : '{}';
    var payload = JSON.parse(raw);
    var action = payload.action || 'upsert';

    if (action === 'delete' && payload.id) {
      var lastRow = sheet.getLastRow();
      if (lastRow > 1) {
        var ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
        for (var i = ids.length - 1; i >= 0; i--) {
          if (String(ids[i][0]) === String(payload.id)) {
            sheet.deleteRow(i + 2);
          }
        }
      }
    } else if (action === 'syncAll' && Array.isArray(payload.bookmarks)) {
      for (var j = 0; j < payload.bookmarks.length; j++) {
        upsertBookmarkRow_(sheet, payload.bookmarks[j]);
      }
    } else if (payload.bookmark) {
      upsertBookmarkRow_(sheet, payload.bookmark);
    }

    return ContentService
      .createTextOutput(JSON.stringify({ status: 'ok', action: action }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService
      .createTextOutput(JSON.stringify({ status: 'error', message: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  } finally {
    lock.releaseLock();
  }
}`;

// 取得書籤當前選用濾鏡的圖片 DataURL
function resolveActiveBookmarkImage(bm) {
  if (!bm) return '';
  const vm = bm.visualMode || 'blank-sketch';
  if (vm === 'blank-sketch') return '';
  if (vm === 'original') return bm.originalImage || bm.imageDataUrl || '';
  if (vm === 'woodcut' || vm === 'pen-sketch') {
    return bm.woodcutImage || bm.sketchImage || bm.imageDataUrl || bm.originalImage || '';
  }
  if (vm === 'oil-painting') {
    return bm.oilPaintingImage || bm.imageDataUrl || bm.originalImage || '';
  }
  if (vm === 'watercolor') return bm.watercolorImage || bm.imageDataUrl || bm.originalImage || '';
  if (vm === 'mosaic') return bm.mosaicImage || bm.imageDataUrl || bm.originalImage || '';
  return bm.imageDataUrl || '';
}

// 壓縮單張 DataURL 以確保不超過 Google 試算表單一儲存格 50,000 字元上限
function shrinkDataUrlForGoogleSheets(dataUrl, maxDim = 440, quality = 0.76) {
  return new Promise((resolve) => {
    if (!dataUrl || dataUrl.length < 44000) {
      resolve(dataUrl || '');
      return;
    }
    const img = new window.Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FAF8F5';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve('');
    img.src = dataUrl;
  });
}

async function postToGoogleAppsScript(gasUrl, payload) {
  if (!gasUrl || !gasUrl.trim()) return { ok: false, skipped: true };
  const cleanUrl = gasUrl.trim();
  const bodyStr = JSON.stringify(payload);
  try {
    const res = await fetch(cleanUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: bodyStr,
      redirect: 'follow',
    });
    const text = await res.text();
    try {
      const json = JSON.parse(text);
      return { ok: json.status === 'ok', data: json };
    } catch {
      return { ok: res.ok };
    }
  } catch {
    // 備援：若受跨網域瀏覽器策略限制，改以 no-cors 送出確保資料寫入試算表
    try {
      await fetch(cleanUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: bodyStr,
      });
      return { ok: true, opaque: true };
    } catch (err2) {
      return { ok: false, error: String(err2) };
    }
  }
}

// 3. Typography & Pure-Pixel Canvas Photo Filters
//    直排文字轉換、相片無失真壓縮與 5 種純像素藝術濾鏡演算引擎

function formatVerticalChineseText(text) {
  if (!text) return '';
  return text
    .replace(/「/g, '﹁')
    .replace(/」/g, '﹂')
    .replace(/『/g, '﹃')
    .replace(/』/g, '﹄')
    .replace(/（/g, '︵')
    .replace(/）/g, '︶')
    .replace(/\(/g, '︵')
    .replace(/\)/g, '︶');
}

function splitIntoVerticalColumns(text, maxCharsPerCol = 10, maxCols = 5) {
  const formatted = formatVerticalChineseText((text || '').trim());
  if (!formatted) return [];
  const chars = Array.from(formatted).slice(0, maxCharsPerCol * maxCols);
  const columns = [];
  for (let i = 0; i < chars.length; i += maxCharsPerCol) {
    columns.push(chars.slice(i, i + maxCharsPerCol));
  }
  return columns;
}

function compressImageFile(file, maxDimension = 640, quality = 0.88) {
  return new Promise((resolve, reject) => {
    const processLoadedImage = (img) => {
      try {
        let { width, height } = img;
        if (!width || !height) {
          reject(new Error('無法讀取圖片尺寸'));
          return;
        }
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FAF8F5';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch (err) {
        reject(err);
      }
    };

    const loadWithFileReaderFallback = () => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const fallbackImg = new window.Image();
        fallbackImg.onload = () => processLoadedImage(fallbackImg);
        fallbackImg.onerror = (err) => reject(err);
        fallbackImg.src = event.target?.result || '';
      };
      reader.onerror = (err) => reject(err);
      reader.readAsDataURL(file);
    };

    if (typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
      const objectUrl = URL.createObjectURL(file);
      const img = new window.Image();
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        processLoadedImage(img);
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        loadWithFileReaderFallback();
      };
      img.src = objectUrl;
    } else {
      loadWithFileReaderFallback();
    }
  });
}

function separableBoxBlurRgba(srcData, w, h, radius) {
  const temp = new Uint8ClampedArray(srcData.length);
  const dst = new Uint8ClampedArray(srcData.length);
  const windowSize = radius * 2 + 1;

  for (let y = 0; y < h; y++) {
    const rowOffset = y * w * 4;
    let rSum = 0;
    let gSum = 0;
    let bSum = 0;

    for (let k = -radius; k <= radius; k++) {
      const cx = Math.min(w - 1, Math.max(0, k));
      const idx = rowOffset + cx * 4;
      rSum += srcData[idx];
      gSum += srcData[idx + 1];
      bSum += srcData[idx + 2];
    }

    for (let x = 0; x < w; x++) {
      const outIdx = rowOffset + x * 4;
      temp[outIdx] = Math.round(rSum / windowSize);
      temp[outIdx + 1] = Math.round(gSum / windowSize);
      temp[outIdx + 2] = Math.round(bSum / windowSize);
      temp[outIdx + 3] = 255;

      const removeX = Math.min(w - 1, Math.max(0, x - radius));
      const addX = Math.min(w - 1, Math.max(0, x + radius + 1));
      const remIdx = rowOffset + removeX * 4;
      const addIdx = rowOffset + addX * 4;
      rSum += srcData[addIdx] - srcData[remIdx];
      gSum += srcData[addIdx + 1] - srcData[remIdx + 1];
      bSum += srcData[addIdx + 2] - srcData[remIdx + 2];
    }
  }

  for (let x = 0; x < w; x++) {
    let rSum = 0;
    let gSum = 0;
    let bSum = 0;

    for (let k = -radius; k <= radius; k++) {
      const cy = Math.min(h - 1, Math.max(0, k));
      const idx = (cy * w + x) * 4;
      rSum += temp[idx];
      gSum += temp[idx + 1];
      bSum += temp[idx + 2];
    }

    for (let y = 0; y < h; y++) {
      const outIdx = (y * w + x) * 4;
      dst[outIdx] = Math.round(rSum / windowSize);
      dst[outIdx + 1] = Math.round(gSum / windowSize);
      dst[outIdx + 2] = Math.round(bSum / windowSize);
      dst[outIdx + 3] = 255;

      const removeY = Math.min(h - 1, Math.max(0, y - radius));
      const addY = Math.min(h - 1, Math.max(0, y + radius + 1));
      const remIdx = (removeY * w + x) * 4;
      const addIdx = (addY * w + x) * 4;
      rSum += temp[addIdx] - temp[remIdx];
      gSum += temp[addIdx + 1] - temp[remIdx + 1];
      bSum += temp[addIdx + 2] - temp[remIdx + 2];
    }
  }

  return dst;
}

function generateAllPhotoFilters(sourceDataUrl) {
  return new Promise((resolve) => {
    const img = new window.Image();
    img.onload = () => {
      const w = img.width;
      const h = img.height;

      const baseCanvas = document.createElement('canvas');
      baseCanvas.width = w;
      baseCanvas.height = h;
      const baseCtx = baseCanvas.getContext('2d');
      baseCtx.fillStyle = '#FAF8F5';
      baseCtx.fillRect(0, 0, w, h);
      baseCtx.drawImage(img, 0, 0, w, h);
      const src = baseCtx.getImageData(0, 0, w, h).data;

      // 1. 照片原圖 ('original')
      const origCanvas = document.createElement('canvas');
      origCanvas.width = w;
      origCanvas.height = h;
      const origCtx = origCanvas.getContext('2d');
      const origImgData = origCtx.createImageData(w, h);
      const od = origImgData.data;
      for (let i = 0; i < src.length; i += 4) {
        od[i] = Math.min(255, Math.max(0, Math.round((src[i] - 128) * 1.04 + 131)));
        od[i + 1] = Math.min(255, Math.max(0, Math.round((src[i + 1] - 128) * 1.04 + 129)));
        od[i + 2] = Math.min(255, Math.max(0, Math.round((src[i + 2] - 128) * 1.03 + 123)));
        od[i + 3] = 255;
      }
      origCtx.putImageData(origImgData, 0, 0);
      const originalDataUrl = origCanvas.toDataURL('image/jpeg', 0.88);

      // 2. 復古木刻版畫 ('woodcut') — Sobel 邊緣偵測 + 木刻斜線排線
      const lum = new Float32Array(w * h);
      for (let i = 0, p = 0; i < src.length; i += 4, p++) {
        lum[p] = 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2];
      }

      const smoothLum = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        const ym1 = Math.max(0, y - 1);
        const yp1 = Math.min(h - 1, y + 1);
        for (let x = 0; x < w; x++) {
          const xm1 = Math.max(0, x - 1);
          const xp1 = Math.min(w - 1, x + 1);
          const sum =
            lum[ym1 * w + xm1] +
            2 * lum[ym1 * w + x] +
            lum[ym1 * w + xp1] +
            2 * lum[y * w + xm1] +
            4 * lum[y * w + x] +
            2 * lum[y * w + xp1] +
            lum[yp1 * w + xm1] +
            2 * lum[yp1 * w + x] +
            lum[yp1 * w + xp1];
          smoothLum[y * w + x] = sum / 16;
        }
      }

      const woodcutCanvas = document.createElement('canvas');
      woodcutCanvas.width = w;
      woodcutCanvas.height = h;
      const woodcutCtx = woodcutCanvas.getContext('2d');
      const woodcutImgData = woodcutCtx.createImageData(w, h);
      const wcd = woodcutImgData.data;

      for (let y = 0; y < h; y++) {
        const ym1 = Math.max(0, y - 1);
        const yp1 = Math.min(h - 1, y + 1);
        for (let x = 0; x < w; x++) {
          const xm1 = Math.max(0, x - 1);
          const xp1 = Math.min(w - 1, x + 1);
          const p = y * w + x;
          const idx = p * 4;

          const gx =
            -smoothLum[ym1 * w + xm1] +
            smoothLum[ym1 * w + xp1] -
            2 * smoothLum[y * w + xm1] +
            2 * smoothLum[y * w + xp1] -
            smoothLum[yp1 * w + xm1] +
            smoothLum[yp1 * w + xp1];
          const gy =
            -smoothLum[ym1 * w + xm1] -
            2 * smoothLum[ym1 * w + x] -
            smoothLum[ym1 * w + xp1] +
            smoothLum[yp1 * w + xm1] +
            2 * smoothLum[yp1 * w + x] +
            smoothLum[yp1 * w + xp1];
          const edgeMag = Math.hypot(gx, gy);

          const v = smoothLum[p];
          const hatchWave = Math.sin((x + y * 0.85) * 0.95);
          const woodGrain = (((x * 13 + y * 29) % 17) - 8) * 0.9;

          if (edgeMag > 68 || v < 62) {
            wcd[idx] = 38;
            wcd[idx + 1] = 34;
            wcd[idx + 2] = 30;
          } else if (v < 118) {
            if (hatchWave > 0.25) {
              wcd[idx] = 44;
              wcd[idx + 1] = 39;
              wcd[idx + 2] = 34;
            } else {
              wcd[idx] = 246;
              wcd[idx + 1] = 241;
              wcd[idx + 2] = 232;
            }
          } else if (v < 168) {
            if (edgeMag > 36 || hatchWave > 0.68) {
              wcd[idx] = 148;
              wcd[idx + 1] = 62;
              wcd[idx + 2] = 48;
            } else {
              wcd[idx] = Math.min(255, Math.max(0, 248 + woodGrain));
              wcd[idx + 1] = Math.min(255, Math.max(0, 244 + woodGrain));
              wcd[idx + 2] = Math.min(255, Math.max(0, 236 + woodGrain));
            }
          } else {
            wcd[idx] = Math.min(255, Math.max(0, 250 + woodGrain));
            wcd[idx + 1] = Math.min(255, Math.max(0, 247 + woodGrain));
            wcd[idx + 2] = Math.min(255, Math.max(0, 241 + woodGrain));
          }
          wcd[idx + 3] = 255;
        }
      }
      woodcutCtx.putImageData(woodcutImgData, 0, 0);
      const woodcutDataUrl = woodcutCanvas.toDataURL('image/jpeg', 0.88);

      // 3. 印象厚塗油畫 ('oil-painting') — Kuwahara 四象限最小變異數筆觸
      const oilCanvas = document.createElement('canvas');
      oilCanvas.width = w;
      oilCanvas.height = h;
      const oilCtx = oilCanvas.getContext('2d');
      const oilImgData = oilCtx.createImageData(w, h);
      const opd = oilImgData.data;

      const brushR = Math.max(2, Math.round(Math.min(w, h) / 140));
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let bestVar = Infinity;
          let bestR = 0;
          let bestG = 0;
          let bestB = 0;

          const quadrants = [
            [-brushR, 0, -brushR, 0],
            [0, brushR, -brushR, 0],
            [-brushR, 0, 0, brushR],
            [0, brushR, 0, brushR],
          ];

          for (let q = 0; q < 4; q++) {
            const [dx0, dx1, dy0, dy1] = quadrants[q];
            let rSum = 0;
            let gSum = 0;
            let bSum = 0;
            let lumSum = 0;
            let lumSqSum = 0;
            let cnt = 0;

            for (let dy = dy0; dy <= dy1; dy++) {
              const sy = Math.min(h - 1, Math.max(0, y + dy));
              for (let dx = dx0; dx <= dx1; dx++) {
                const sx = Math.min(w - 1, Math.max(0, x + dx));
                const sIdx = (sy * w + sx) * 4;
                const r = src[sIdx];
                const g = src[sIdx + 1];
                const b = src[sIdx + 2];
                const l = 0.299 * r + 0.587 * g + 0.114 * b;
                rSum += r;
                gSum += g;
                bSum += b;
                lumSum += l;
                lumSqSum += l * l;
                cnt++;
              }
            }

            const meanLum = lumSum / cnt;
            const variance = lumSqSum / cnt - meanLum * meanLum;
            if (variance < bestVar) {
              bestVar = variance;
              bestR = rSum / cnt;
              bestG = gSum / cnt;
              bestB = bSum / cnt;
            }
          }

          const avg = (bestR + bestG + bestB) / 3;
          const satBoost = 1.24;
          const impastoStroke =
            Math.sin(x * 0.55 - y * 0.45) * 7 + (x % 3 === 0 && y % 3 === 0 ? 4 : -2);

          const outIdx = (y * w + x) * 4;
          opd[outIdx] = Math.min(
            255,
            Math.max(0, Math.round(avg + (bestR - avg) * satBoost + impastoStroke + 4))
          );
          opd[outIdx + 1] = Math.min(
            255,
            Math.max(0, Math.round(avg + (bestG - avg) * satBoost + impastoStroke + 1))
          );
          opd[outIdx + 2] = Math.min(
            255,
            Math.max(0, Math.round(avg + (bestB - avg) * satBoost + impastoStroke - 4))
          );
          opd[outIdx + 3] = 255;
        }
      }
      oilCtx.putImageData(oilImgData, 0, 0);
      const oilPaintingDataUrl = oilCanvas.toDataURL('image/jpeg', 0.88);

      // 4. 溫潤水彩暈染 ('watercolor') — 可分離盒式模糊 + 色階量化 + 棉紙暈邊
      const wcCanvas = document.createElement('canvas');
      wcCanvas.width = w;
      wcCanvas.height = h;
      const wcCtx = wcCanvas.getContext('2d');
      const blurredRgba = separableBoxBlurRgba(src, w, h, 3);
      const wcImgData = wcCtx.createImageData(w, h);
      const wd = wcImgData.data;

      const levels = 9;
      const step = 255 / levels;
      for (let i = 0, p = 0; i < blurredRgba.length; i += 4, p++) {
        const x = p % w;
        const y = Math.floor(p / w);
        const grain = (((x * 17 + y * 31) % 13) - 6) * 1.4;

        const br = blurredRgba[i];
        const bg = blurredRgba[i + 1];
        const bb = blurredRgba[i + 2];
        const mean = (br + bg + bb) / 3;
        const sr = mean + (br - mean) * 1.25;
        const sg = mean + (bg - mean) * 1.25;
        const sb = mean + (bb - mean) * 1.25;

        const qr = Math.min(255, Math.max(0, Math.round(sr / step) * step + grain));
        const qg = Math.min(255, Math.max(0, Math.round(sg / step) * step + grain));
        const qb = Math.min(255, Math.max(0, Math.round(sb / step) * step + grain));

        wd[i] = Math.round(qr * 0.82 + 250 * 0.18);
        wd[i + 1] = Math.round(qg * 0.82 + 248 * 0.18);
        wd[i + 2] = Math.round(qb * 0.8 + 245 * 0.2);
        wd[i + 3] = 255;
      }
      wcCtx.putImageData(wcImgData, 0, 0);

      const vig = wcCtx.createRadialGradient(
        w / 2,
        h / 2,
        Math.min(w, h) * 0.34,
        w / 2,
        h / 2,
        Math.max(w, h) * 0.68
      );
      vig.addColorStop(0, 'rgba(250, 248, 245, 0)');
      vig.addColorStop(1, 'rgba(250, 248, 245, 0.55)');
      wcCtx.fillStyle = vig;
      wcCtx.fillRect(0, 0, w, h);
      const watercolorDataUrl = wcCanvas.toDataURL('image/jpeg', 0.88);

      // 5. 復古馬賽克拼貼 ('mosaic') — 磁磚均值拼貼 + 灰縫高光
      const mosaicCanvas = document.createElement('canvas');
      mosaicCanvas.width = w;
      mosaicCanvas.height = h;
      const mosaicCtx = mosaicCanvas.getContext('2d');
      mosaicCtx.fillStyle = '#EAE2D3';
      mosaicCtx.fillRect(0, 0, w, h);

      const tileSize = Math.max(8, Math.round(Math.min(w, h) / 40));
      const grout = 1.3;
      for (let ty = 0; ty < h; ty += tileSize) {
        for (let tx = 0; tx < w; tx += tileSize) {
          let rSum = 0,
            gSum = 0,
            bSum = 0,
            count = 0;
          const maxY = Math.min(h, ty + tileSize);
          const maxX = Math.min(w, tx + tileSize);
          for (let py = ty; py < maxY; py += 2) {
            for (let px = tx; px < maxX; px += 2) {
              const idx = (py * w + px) * 4;
              rSum += src[idx];
              gSum += src[idx + 1];
              bSum += src[idx + 2];
              count++;
            }
          }
          if (count > 0) {
            const rAvg = Math.round(rSum / count);
            const gAvg = Math.round(gSum / count);
            const bAvg = Math.round(bSum / count);
            mosaicCtx.fillStyle = `rgb(${rAvg}, ${gAvg}, ${bAvg})`;
            mosaicCtx.fillRect(
              tx + grout * 0.5,
              ty + grout * 0.5,
              Math.max(1, tileSize - grout),
              Math.max(1, tileSize - grout)
            );
            mosaicCtx.fillStyle = 'rgba(255, 252, 245, 0.14)';
            mosaicCtx.fillRect(
              tx + grout * 0.5,
              ty + grout * 0.5,
              Math.max(1, tileSize - grout),
              1.5
            );
          }
        }
      }
      const mosaicDataUrl = mosaicCanvas.toDataURL('image/jpeg', 0.88);

      resolve({
        original: originalDataUrl,
        woodcut: woodcutDataUrl,
        oilPainting: oilPaintingDataUrl,
        watercolor: watercolorDataUrl,
        mosaic: mosaicDataUrl,
      });
    };
    img.onerror = () =>
      resolve({
        original: sourceDataUrl,
        woodcut: sourceDataUrl,
        oilPainting: sourceDataUrl,
        watercolor: sourceDataUrl,
        mosaic: sourceDataUrl,
      });
    img.src = sourceDataUrl;
  });
}

// ============================================================================
// 3.5 Standard A4 Landscape Double-Sided 200 DPI PDF Generator
//      瀏覽器本機 200 DPI 高解析光柵封裝引擎（297mm × 210mm 四連排精準輸出）
//      - 奇數頁：正面 [1][2][3][4]
//      - 偶數頁：短邊翻轉鏡像 [4][3][2][1]
//      - 零外部相依性純二進位 PDF 1.4 封裝（支援下載與新分頁預覽）
// ============================================================================
const PDF_DPI = 200;
const PDF_MM_TO_PX = PDF_DPI / 25.4;
const PDF_PAGE_W_MM = 297;
const PDF_PAGE_H_MM = 210;
const PDF_PAGE_W_PX = Math.round(PDF_PAGE_W_MM * PDF_MM_TO_PX); // 2339 px
const PDF_PAGE_H_PX = Math.round(PDF_PAGE_H_MM * PDF_MM_TO_PX); // 1654 px
const PDF_PAGE_W_PT = 841.89; // 297mm in PDF points (1/72 in)
const PDF_PAGE_H_PT = 595.28; // 210mm in PDF points (1/72 in)

// 地理位置最鄰近自動同頁拼版演算法（以「竹園岡・臺南一中」為起點）
function sortBookmarksByNearestNeighbor(bookmarksList) {
  if (!Array.isArray(bookmarksList) || bookmarksList.length <= 1) {
    return [...(bookmarksList || [])];
  }
  const remaining = [...bookmarksList];
  const ordered = [];
  let currentX = TNFSH_ANCHOR.x;
  let currentY = TNFSH_ANCHOR.y;

  while (remaining.length > 0) {
    let bestIdx = 0;
    let bestDist = Infinity;
    for (let i = 0; i < remaining.length; i++) {
      const coords = remaining[i].mapCoords || TNFSH_ANCHOR;
      const dist = Math.hypot(
        (coords.x ?? TNFSH_ANCHOR.x) - currentX,
        (coords.y ?? TNFSH_ANCHOR.y) - currentY
      );
      if (dist < bestDist) {
        bestDist = dist;
        bestIdx = i;
      }
    }
    const [picked] = remaining.splice(bestIdx, 1);
    ordered.push(picked);
    const nextCoords = picked.mapCoords || TNFSH_ANCHOR;
    currentX = nextCoords.x ?? TNFSH_ANCHOR.x;
    currentY = nextCoords.y ?? TNFSH_ANCHOR.y;
  }
  return ordered;
}

function loadHtmlImageAsync(src) {
  return new Promise((resolve) => {
    if (!src) {
      resolve(null);
      return;
    }
    const img = new window.Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function wrapChineseParagraphLines(ctx, text, maxWidth, maxLines = 7) {
  const clean = (text || '').replace(/\r?\n/g, ' ').trim();
  if (!clean) return [];
  const chars = Array.from(clean);
  const closingPunc = new Set([
    '，',
    '。',
    '、',
    '！',
    '？',
    '；',
    '：',
    '」',
    '』',
    '）',
    '．',
    ',',
    '.',
    '!',
    '?',
  ]);
  const lines = [];
  let currentLine = '';

  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    const testLine = currentLine + ch;
    const width = ctx.measureText(testLine).width;
    if (width > maxWidth && currentLine.length > 0) {
      if (closingPunc.has(ch) && lines.length < maxLines - 1) {
        lines.push(testLine);
        currentLine = '';
      } else {
        lines.push(currentLine);
        currentLine = ch;
      }
      if (lines.length >= maxLines) {
        break;
      }
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine && lines.length < maxLines) {
    lines.push(currentLine);
  }
  return lines.slice(0, maxLines);
}

function drawMiniTaiwanIconOnCanvas(ctx, x, y, w, h, coords) {
  ctx.save();
  ctx.translate(x, y);
  // 對應 viewBox="24 4 56 92"
  const sx = w / 56;
  const sy = h / 92;
  ctx.scale(sx, sy);
  ctx.translate(-24, -4);

  const island = new Path2D(
    'M66 8 L73 12 L76 19 L72 28 L68 45 L63 65 L58 83 L55 94 L51 95 L46 84 L38 75 L34 67 L35 56 L39 45 L45 33 L55 19 L61 11 Z'
  );
  ctx.fillStyle = '#FAF8F5';
  ctx.fill(island);
  ctx.strokeStyle = '#A63A2B';
  ctx.lineWidth = 3.2;
  ctx.lineJoin = 'round';
  ctx.stroke(island);

  // 澎湖小點
  ctx.beginPath();
  ctx.arc(28, 64, 1.8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(166, 58, 43, 0.6)';
  ctx.fill();

  const cx = coords?.x ?? TNFSH_ANCHOR.x;
  const cy = coords?.y ?? TNFSH_ANCHOR.y;
  ctx.beginPath();
  ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(166, 58, 43, 0.28)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
  ctx.fillStyle = '#A63A2B';
  ctx.fill();

  ctx.restore();
}

function drawSlotCropAndGuides(ctx, offsetX, slotW, slotH, colIdx, showCropMarks) {
  if (!showCropMarks) return;
  const mm = (v) => v * PDF_MM_TO_PX;
  ctx.save();
  if (colIdx > 0) {
    ctx.strokeStyle = 'rgba(166, 58, 43, 0.55)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([mm(1.6), mm(1.4)]);
    ctx.beginPath();
    ctx.moveTo(offsetX, 0);
    ctx.lineTo(offsetX, slotH);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  const tick = mm(2.6);
  ctx.strokeStyle = 'rgba(38, 38, 35, 0.72)';
  ctx.lineWidth = 1.6;
  // 左上
  ctx.beginPath();
  ctx.moveTo(offsetX, tick);
  ctx.lineTo(offsetX, 0);
  ctx.lineTo(offsetX + tick, 0);
  ctx.stroke();
  // 右上
  ctx.beginPath();
  ctx.moveTo(offsetX + slotW - tick, 0);
  ctx.lineTo(offsetX + slotW, 0);
  ctx.lineTo(offsetX + slotW, tick);
  ctx.stroke();
  // 左下
  ctx.beginPath();
  ctx.moveTo(offsetX, slotH - tick);
  ctx.lineTo(offsetX, slotH);
  ctx.lineTo(offsetX + tick, slotH);
  ctx.stroke();
  // 右下
  ctx.beginPath();
  ctx.moveTo(offsetX + slotW - tick, slotH);
  ctx.lineTo(offsetX + slotW, slotH);
  ctx.lineTo(offsetX + slotW, slotH - tick);
  ctx.stroke();
  ctx.restore();
}

function drawEmptySlotOnCanvas(ctx, offsetX, slotW, slotH, logicalSlotNumber) {
  const mm = (v) => v * PDF_MM_TO_PX;
  ctx.save();
  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(offsetX, 0, slotW, slotH);

  ctx.strokeStyle = '#D8D0C5';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([mm(2), mm(2)]);
  ctx.strokeRect(offsetX + mm(3), mm(3), slotW - mm(6), slotH - mm(6));
  ctx.setLineDash([]);

  ctx.fillStyle = '#C7BEB0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${mm(3.2)}px "Noto Serif TC", serif`;
  ctx.fillText(`第 ${logicalSlotNumber} 格留白`, offsetX + slotW / 2, slotH / 2 - mm(2.5));
  ctx.font = `400 ${mm(2.4)}px "Noto Serif TC", serif`;
  ctx.fillText('（未配置書籤）', offsetX + slotW / 2, slotH / 2 + mm(2.8));
  ctx.restore();
}

function drawBookmarkSideAOnCanvas(ctx, bm, offsetX, slotW, slotH, loadedImg) {
  const mm = (v) => v * PDF_MM_TO_PX;
  ctx.save();

  // 底色
  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(offsetX, 0, slotW, slotH);

  // 雙層外框（2.6mm 外墨線、3.5mm 內磚紅線）
  ctx.strokeStyle = 'rgba(38, 38, 35, 0.45)';
  ctx.lineWidth = 1.6;
  ctx.strokeRect(offsetX + mm(2.6), mm(2.6), slotW - mm(5.2), slotH - mm(5.2));

  ctx.strokeStyle = '#A63A2B';
  ctx.lineWidth = 2.0;
  ctx.strokeRect(offsetX + mm(3.5), mm(3.5), slotW - mm(7.0), slotH - mm(7.0));

  const padX = mm(5.0);
  const padY = mm(5.5);
  const innerX = offsetX + padX;
  const innerW = slotW - padX * 2;

  // 頁首標題區
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#A63A2B';
  ctx.font = `700 ${mm(3.0)}px "Noto Serif TC", serif`;
  ctx.fillText('一頁府城・百年書籤', innerX, padY);

  ctx.fillStyle = '#7A6F66';
  ctx.font = `400 ${mm(1.9)}px "Noto Serif TC", serif`;
  ctx.fillText('溯源・宿緣・塑垣', innerX, padY + mm(3.8));

  // 右上印章「南一中105」
  ctx.font = `700 ${mm(2.2)}px "Noto Serif TC", serif`;
  const stampText = '南一中105';
  const stampTextW = ctx.measureText(stampText).width;
  const stampW = stampTextW + mm(2.8);
  const stampH = mm(4.2);
  const stampX = innerX + innerW - stampW;
  const stampY = padY + mm(0.6);
  ctx.fillStyle = 'rgba(247, 236, 234, 0.85)';
  ctx.fillRect(stampX, stampY, stampW, stampH);
  ctx.strokeStyle = '#A63A2B';
  ctx.lineWidth = 2.0;
  ctx.strokeRect(stampX, stampY, stampW, stampH);
  ctx.fillStyle = '#A63A2B';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(stampText, stampX + stampW / 2, stampY + stampH / 2 + 0.5);

  // 頁首分隔線
  const headerBottomY = padY + mm(7.4);
  ctx.strokeStyle = 'rgba(166, 58, 43, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(innerX, headerBottomY);
  ctx.lineTo(innerX + innerW, headerBottomY);
  ctx.stroke();

  // 中段直排題字區（右起左行，每行至多 10 字，最多 5 行）
  const verticalColumns = splitIntoVerticalColumns(
    bm.sideAText || '臺南是一個適合人們作夢、幹活、戀愛、結婚，悠然過活的地方。',
    10,
    5
  );
  const punctuationSet = new Set(['、', '，', '。', '！', '？', '；', '：', '．']);
  const colW = mm(12.2);
  const charH = mm(9.2);
  const totalColsW = verticalColumns.length * colW;
  const startRightX = offsetX + slotW / 2 + totalColsW / 2;
  const colsTopY = headerBottomY + mm(2.8);

  verticalColumns.forEach((colChars, colIdx) => {
    const colLeft = startRightX - (colIdx + 1) * colW;
    ctx.strokeStyle = '#EAE2D3';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(colLeft, colsTopY);
    ctx.lineTo(colLeft, colsTopY + 10 * charH);
    if (colIdx === 0) {
      ctx.moveTo(colLeft + colW, colsTopY);
      ctx.lineTo(colLeft + colW, colsTopY + 10 * charH);
    }
    ctx.stroke();

    ctx.fillStyle = '#262623';
    ctx.font = `500 ${mm(7.0)}px "Noto Serif TC", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    colChars.forEach((ch, charIdx) => {
      const isPunc = punctuationSet.has(ch);
      const cx = colLeft + colW / 2 + (isPunc ? mm(2.2) : 0);
      const cy = colsTopY + charIdx * charH + charH / 2 - (isPunc ? mm(1.1) : 0);
      ctx.fillText(ch, cx, cy);
    });
  });

  // 底部元件由下往上精準定位
  const footerLineY = slotH - padY - mm(5.6);
  const badgeH = mm(8.4);
  const badgeY = footerLineY - mm(2.0) - badgeH;
  const frameH = mm(52.0);
  const frameY = badgeY - mm(2.4) - frameH;

  // 風景畫框（52mm 高度）
  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(innerX, frameY, innerW, frameH);

  if (loadedImg) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(innerX, frameY, innerW, frameH);
    ctx.clip();
    const imgRatio = loadedImg.width / loadedImg.height;
    const boxRatio = innerW / frameH;
    let dw = innerW;
    let dh = frameH;
    let dx = innerX;
    let dy = frameY;
    if (imgRatio > boxRatio) {
      dw = frameH * imgRatio;
      dx = innerX - (dw - innerW) / 2;
    } else {
      dh = innerW / imgRatio;
      dy = frameY - (dh - frameH) / 2;
    }
    ctx.drawImage(loadedImg, dx, dy, dw, dh);
    ctx.restore();
  } else {
    if (bm.dotGrid) {
      const dotStep = mm(3.2);
      ctx.fillStyle = '#B8ADA2';
      for (let gy = frameY + dotStep; gy < frameY + frameH - mm(1); gy += dotStep) {
        for (let gx = innerX + dotStep; gx < innerX + innerW - mm(1); gx += dotStep) {
          ctx.beginPath();
          ctx.arc(gx, gy, 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    // 四角對位角標
    const bLen = mm(2.2);
    const bInset = mm(1.6);
    ctx.strokeStyle = 'rgba(166, 58, 43, 0.55)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(innerX + bInset, frameY + bInset + bLen);
    ctx.lineTo(innerX + bInset, frameY + bInset);
    ctx.lineTo(innerX + bInset + bLen, frameY + bInset);
    ctx.moveTo(innerX + innerW - bInset - bLen, frameY + bInset);
    ctx.lineTo(innerX + innerW - bInset, frameY + bInset);
    ctx.lineTo(innerX + innerW - bInset, frameY + bInset + bLen);
    ctx.moveTo(innerX + bInset, frameY + frameH - bInset - bLen);
    ctx.lineTo(innerX + bInset, frameY + frameH - bInset);
    ctx.lineTo(innerX + bInset + bLen, frameY + frameH - bInset);
    ctx.moveTo(innerX + innerW - bInset - bLen, frameY + frameH - bInset);
    ctx.lineTo(innerX + innerW - bInset, frameY + frameH - bInset);
    ctx.lineTo(innerX + innerW - bInset, frameY + frameH - bInset - bLen);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#B8ADA2';
    ctx.font = `500 ${mm(2.8)}px "Noto Serif TC", serif`;
    ctx.fillText('手繪記憶留白區', innerX + innerW / 2, frameY + frameH / 2 - mm(2.0));
    ctx.fillStyle = '#C9BFB4';
    ctx.font = `400 ${mm(2.1)}px "Noto Serif TC", serif`;
    ctx.fillText('（印出後親手繪製）', innerX + innerW / 2, frameY + frameH / 2 + mm(2.2));
  }

  ctx.strokeStyle = 'rgba(166, 58, 43, 0.75)';
  ctx.lineWidth = 1.6;
  ctx.strokeRect(innerX, frameY, innerW, frameH);

  // 地標與迷你臺灣座標圖釘徽章
  const landmarkStr = `〔 ${bm.landmarkLabel || '府城・記憶地標'} 〕`;
  ctx.font = `600 ${mm(2.6)}px "Noto Serif TC", serif`;
  const iconW = mm(4.6);
  const iconH = mm(7.1);
  const txtW = Math.min(innerW - iconW - mm(7), ctx.measureText(landmarkStr).width);
  const pillW = iconW + mm(1.6) + txtW + mm(4.8);
  const pillX = offsetX + (slotW - pillW) / 2;

  ctx.fillStyle = '#F4F0E8';
  ctx.fillRect(pillX, badgeY, pillW, badgeH);
  ctx.strokeStyle = 'rgba(166, 58, 43, 0.65)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(pillX, badgeY, pillW, badgeH);

  drawMiniTaiwanIconOnCanvas(
    ctx,
    pillX + mm(2.2),
    badgeY + (badgeH - iconH) / 2,
    iconW,
    iconH,
    bm.mapCoords
  );

  ctx.fillStyle = '#A63A2B';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(landmarkStr, pillX + mm(2.2) + iconW + mm(1.4), badgeY + badgeH / 2 + 0.5, txtW);

  // 頁尾創作者署名與印章
  ctx.strokeStyle = '#D8D0C5';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(innerX, footerLineY);
  ctx.lineTo(innerX + innerW, footerLineY);
  ctx.stroke();

  const footerTextY = footerLineY + mm(3.2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8A7F76';
  ctx.font = `400 ${mm(2.0)}px "Noto Serif TC", serif`;
  ctx.fillText('TNFSH 105th', innerX, footerTextY);

  const sealSize = mm(4.0);
  const sealX = innerX + innerW - sealSize;
  const sealY = footerTextY - sealSize / 2;
  ctx.strokeStyle = '#A63A2B';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sealX, sealY, sealSize, sealSize);
  ctx.fillStyle = '#A63A2B';
  ctx.textAlign = 'center';
  ctx.font = `700 ${mm(1.8)}px "Noto Serif TC", serif`;
  ctx.fillText('印', sealX + sealSize / 2, sealY + sealSize / 2 + 0.5);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#262623';
  ctx.font = `500 ${mm(2.7)}px "Noto Serif TC", serif`;
  ctx.fillText(`${bm.studentInfo || '南一中學子'} 誌`, sealX - mm(1.5), footerTextY);

  ctx.restore();
}

function drawBookmarkSideBOnCanvas(ctx, bm, offsetX, slotW, slotH) {
  const mm = (v) => v * PDF_MM_TO_PX;
  ctx.save();

  // 先填滿垂直書籤底色
  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(offsetX, 0, slotW, slotH);

  // 旋轉 -90 度進入 210mm × 74.25mm 橫向尺素信箋座標系
  ctx.translate(offsetX + slotW / 2, slotH / 2);
  ctx.rotate(-Math.PI / 2);

  const W = mm(210);
  const H = mm(74.25);
  const x0 = -W / 2;
  const y0 = -H / 2;

  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(x0, y0, W, H);

  // 雙層外框（3.2mm 外墨線、4.1mm 內紅線）
  ctx.strokeStyle = 'rgba(38, 38, 35, 0.4)';
  ctx.lineWidth = 1.6;
  ctx.strokeRect(x0 + mm(3.2), y0 + mm(3.2), W - mm(6.4), H - mm(6.4));

  ctx.strokeStyle = '#9E3B33';
  ctx.lineWidth = 2.0;
  ctx.strokeRect(x0 + mm(4.1), y0 + mm(4.1), W - mm(8.2), H - mm(8.2));

  // 內文區：左右各 5.5mm（內文寬 199mm），上下各 5.5mm（內文高 63.25mm）
  const pad = mm(5.5);
  const cx = x0 + pad;
  const cw = W - pad * 2; // 199mm
  let curY = y0 + pad;

  // 1. 頁首區 (7.20mm)
  const headerH = mm(7.2);
  ctx.fillStyle = '#9E3B33';
  ctx.fillRect(cx, curY + (headerH - mm(3.8)) / 2, mm(1.1), mm(3.8));

  const dynamicHeaderTitle =
    bm.interviewee && bm.interviewee.trim()
      ? `家族尺素・訪【${bm.interviewee.trim()}】紀事`
      : '家族尺素・記憶訪談紀事';

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#9E3B33';
  ctx.font = `700 ${mm(3.5)}px "Noto Serif TC", serif`;
  ctx.fillText(dynamicHeaderTitle, cx + mm(2.6), curY + headerH / 2);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#5C524B';
  ctx.font = `400 ${mm(2.5)}px "Noto Serif TC", serif`;
  ctx.fillText(
    `地標：${bm.landmarkLabel || '府城記憶'}  ｜  竹園岡・一〇五週年紀念`,
    cx + cw,
    curY + headerH / 2
  );

  ctx.strokeStyle = 'rgba(158, 59, 51, 0.45)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, curY + headerH);
  ctx.lineTo(cx + cw, curY + headerH);
  ctx.stroke();

  curY += headerH;

  // 2. 第一段留白：頁首下 2.0mm
  curY += mm(2.0);

  // 3. 訪談記事區：38.50mm（7 行 × 5.50mm 行高，4.45mm 約 12.6pt 黃金微調字級）
  const storyH = mm(38.5);
  const lineH = mm(5.5);
  ctx.fillStyle = '#262623';
  ctx.font = `400 ${mm(4.45)}px "Noto Serif TC", serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  const storyText = Array.from(
    (bm.sideBText || '（請記錄與家人長輩訪談的在地記憶故事，上限 300 字）').trim()
  )
    .slice(0, 300)
    .join('');

  const wrappedLines = wrapChineseParagraphLines(ctx, storyText, cw, 7);
  wrappedLines.forEach((line, idx) => {
    ctx.fillText(line, cx, curY + idx * lineH + lineH / 2);
  });

  curY += storyH;

  // 4. 第二段留白：記事下 2.0mm
  curY += mm(2.0);

  // 5. 下方手寫區：11.55mm（左側 21mm「家人寄語：」3.8mm 字級＋2.6mm 底部內距；右側 178mm 單條虛線貼齊底緣）
  const handH = mm(11.55);
  const labelW = mm(21.0);
  const lineW = mm(178.0); // 21 + 178 = 199mm 內文寬
  const handBottomY = curY + handH;

  ctx.fillStyle = '#A63A2B';
  ctx.font = `700 ${mm(3.8)}px "Noto Serif TC", serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('家人寄語：', cx, handBottomY - mm(2.6));

  ctx.strokeStyle = 'rgba(166, 58, 43, 0.65)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([mm(1.5), mm(1.2)]);
  ctx.beginPath();
  ctx.moveTo(cx + labelW, handBottomY);
  ctx.lineTo(cx + labelW + lineW, handBottomY);
  ctx.stroke();
  ctx.setLineDash([]);

  // 6. 第三段留白：虛線下 2.0mm（curY + handH + 2.0mm 精準抵達底部內邊界）
  ctx.restore();
}

function assembleMultiPagePdfBlob(jpegPages, imgWidthPx, imgHeightPx) {
  const encoder = new TextEncoder();
  const chunks = [];
  let currentOffset = 0;

  const pushBytes = (bytes) => {
    chunks.push(bytes);
    currentOffset += bytes.length;
  };
  const pushStr = (str) => {
    pushBytes(encoder.encode(str));
  };

  // PDF 1.4 檔頭與二進位標記
  pushBytes(
    new Uint8Array([
      0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a,
    ])
  );

  const pageCount = jpegPages.length;
  const totalObjects = 2 + pageCount * 3;
  const objOffsets = new Array(totalObjects + 1).fill(0);

  // 1: Catalog
  objOffsets[1] = currentOffset;
  pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

  // 2: Pages
  const kidsRefs = [];
  for (let i = 0; i < pageCount; i++) {
    kidsRefs.push(`${3 + i * 3} 0 R`);
  }
  objOffsets[2] = currentOffset;
  pushStr(
    `2 0 obj\n<< /Type /Pages /Kids [${kidsRefs.join(' ')}] /Count ${pageCount} >>\nendobj\n`
  );

  // 各頁 Page / Content Stream / 200 DPI JPEG XObject
  for (let i = 0; i < pageCount; i++) {
    const pageObjId = 3 + i * 3;
    const contentObjId = 4 + i * 3;
    const imgObjId = 5 + i * 3;
    const jpegBytes = jpegPages[i];

    objOffsets[pageObjId] = currentOffset;
    pushStr(
      `${pageObjId} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PDF_PAGE_W_PT} ${PDF_PAGE_H_PT}] /Resources << /XObject << /Im${i} ${imgObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>\nendobj\n`
    );

    const streamCmd = `q ${PDF_PAGE_W_PT} 0 0 ${PDF_PAGE_H_PT} 0 0 cm /Im${i} Do Q\n`;
    const streamCmdBytes = encoder.encode(streamCmd);
    objOffsets[contentObjId] = currentOffset;
    pushStr(`${contentObjId} 0 obj\n<< /Length ${streamCmdBytes.length} >>\nstream\n`);
    pushBytes(streamCmdBytes);
    pushStr('endstream\nendobj\n');

    objOffsets[imgObjId] = currentOffset;
    pushStr(
      `${imgObjId} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgWidthPx} /Height ${imgHeightPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`
    );
    pushBytes(jpegBytes);
    pushStr('\nendstream\nendobj\n');
  }

  // 交叉參照表 (xref)
  const xrefOffset = currentOffset;
  pushStr(`xref\n0 ${totalObjects + 1}\n`);
  pushStr('0000000000 65535 f \n');
  for (let id = 1; id <= totalObjects; id++) {
    pushStr(`${String(objOffsets[id]).padStart(10, '0')} 00000 n \n`);
  }

  pushStr(
    `trailer\n<< /Size ${totalObjects + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`
  );

  return new Blob(chunks, { type: 'application/pdf' });
}

function dataUrlToUint8Array(dataUrl) {
  const base64 = dataUrl.split(',')[1] || '';
  const binaryStr = window.atob(base64);
  const len = binaryStr.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryStr.charCodeAt(i);
  }
  return bytes;
}

async function generateStandardA4DoubleSidedPdf(pagesList, showCropMarks = true) {
  if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) {
    try {
      await document.fonts.ready;
    } catch {}
  }

  // 預先載入所有書籤的風景圖片
  const imageCache = new Map();
  for (const slots of pagesList) {
    for (const bm of slots) {
      if (bm && !imageCache.has(bm.id)) {
        const activeSrc = resolveActiveBookmarkImage(bm);
        const loaded = activeSrc ? await loadHtmlImageAsync(activeSrc) : null;
        imageCache.set(bm.id, loaded);
      }
    }
  }

  const canvas = document.createElement('canvas');
  canvas.width = PDF_PAGE_W_PX;
  canvas.height = PDF_PAGE_H_PX;
  const ctx = canvas.getContext('2d');
  const slotW = PDF_PAGE_W_PX / 4;
  const slotH = PDF_PAGE_H_PX;

  const jpegPages = [];

  for (let setIdx = 0; setIdx < pagesList.length; setIdx++) {
    const rawSlots = pagesList[setIdx];
    const normalized = [0, 1, 2, 3].map((i) => rawSlots[i] || null);

    // 奇數頁：正面 [1][2][3][4]
    ctx.fillStyle = '#FAF8F5';
    ctx.fillRect(0, 0, PDF_PAGE_W_PX, PDF_PAGE_H_PX);
    for (let colIdx = 0; colIdx < 4; colIdx++) {
      const bm = normalized[colIdx];
      const offsetX = colIdx * slotW;
      if (bm) {
        drawBookmarkSideAOnCanvas(ctx, bm, offsetX, slotW, slotH, imageCache.get(bm.id) || null);
      } else {
        drawEmptySlotOnCanvas(ctx, offsetX, slotW, slotH, colIdx + 1);
      }
      drawSlotCropAndGuides(ctx, offsetX, slotW, slotH, colIdx, showCropMarks);
    }
    const frontDataUrl = canvas.toDataURL('image/jpeg', 0.9);
    jpegPages.push(dataUrlToUint8Array(frontDataUrl));

    // 偶數頁：短邊翻轉鏡像 [4][3][2][1]
    const mirrored = [normalized[3], normalized[2], normalized[1], normalized[0]];
    ctx.fillStyle = '#FAF8F5';
    ctx.fillRect(0, 0, PDF_PAGE_W_PX, PDF_PAGE_H_PX);
    for (let colIdx = 0; colIdx < 4; colIdx++) {
      const bm = mirrored[colIdx];
      const offsetX = colIdx * slotW;
      const logicalSlotNumber = 4 - colIdx;
      if (bm) {
        drawBookmarkSideBOnCanvas(ctx, bm, offsetX, slotW, slotH);
      } else {
        drawEmptySlotOnCanvas(ctx, offsetX, slotW, slotH, logicalSlotNumber);
      }
      drawSlotCropAndGuides(ctx, offsetX, slotW, slotH, colIdx, showCropMarks);
    }
    const backDataUrl = canvas.toDataURL('image/jpeg', 0.9);
    jpegPages.push(dataUrlToUint8Array(backDataUrl));
  }

  const pdfBlob = assembleMultiPagePdfBlob(jpegPages, PDF_PAGE_W_PX, PDF_PAGE_H_PX);
  const setCount = pagesList.length;
  const totalPages = jpegPages.length;
  const sizeMB = (pdfBlob.size / (1024 * 1024)).toFixed(2);
  const fileName = `南一中105_一頁府城記憶書籤_A4雙面四連排_${setCount}組.pdf`;

  return {
    blob: pdfBlob,
    totalPages,
    setCount,
    sizeMB,
    fileName,
  };
}

      if (!groups[key]) groups[key] = [];
      groups[key].push(bm);

    const result = [];
    Object.values(groups).forEach((group) => {
      group.forEach((bm, idx) => {
        const base = bm.mapCoords || TNFSH_ANCHOR;
        if (idx === 0) {
          result.push({ ...bm, displayCoords: { x: base.x, y: base.y } });

          const spiralRadius = 0.42 * Math.sqrt(idx);

            displayCoords: {

// ============================================================================
// 6. A4 Landscape Double-Sided Bookmark Imposition Sheet Component
//    A4 橫式滿版拼版（297mm × 210mm = 4 枚 74.25mm × 210mm 書籤）
//    正面順序：[1][2][3][4]；背面自動鏡像順序：[4][3][2][1]
// ============================================================================
function A4ImpositionSheet({ slots, side = 'front', showCropMarks = true, isPrintRender = false }) {
  const normalizedSlots = [0, 1, 2, 3].map((i) => slots[i] || null);
  const arrangedSlots =
    side === 'back'
      ? [normalizedSlots[3], normalizedSlots[2], normalizedSlots[1], normalizedSlots[0]]
      : normalizedSlots;

  return (
    <div
      style={{
        width: '297mm',
        height: '210mm',
        backgroundColor: '#FAF8F5',
      }}
      className={`relative flex flex-row items-stretch overflow-hidden box-border ${
        isPrintRender ? 'print-a4-page' : 'shadow-2xl border border-[#C7BCB0]'
      }`}
    >
      {arrangedSlots.map((bm, colIdx) => {
        const logicalSlotNumber = side === 'back' ? 4 - colIdx : colIdx + 1;
        return (
          <div
            key={`a4-col-${side}-${colIdx}-${bm?.id || 'empty'}`}
            style={{
              width: '74.25mm',
              height: '210mm',
            }}
            className="relative shrink-0 box-border overflow-hidden"
          >
            {bm ? (
              side === 'front' ? (
                <BookmarkSideA bookmark={bm} mode="print" />
              ) : (
                <BookmarkSideB bookmark={bm} mode="print" />
              )
            ) : (
              <div className="w-full h-full flex flex-col items-center justify-center bg-[#FAF8F5] text-[#C7BEB0] font-serif select-none border border-dashed border-[#D8D0C5]">
                <span className="text-xs tracking-widest">第 {logicalSlotNumber} 格留白</span>
                <span className="text-[10px] mt-1">（未配置書籤）</span>
              </div>
            )}

            {showCropMarks && (
              <>
                {colIdx > 0 && (
                  <div
                    className="absolute top-0 bottom-0 left-0 pointer-events-none z-30"
                    style={{
                      borderLeft: '0.4pt dashed rgba(166, 58, 43, 0.55)',
                    }}
                  />
                )}
                <div

}

function App() {
  const urlParams = useMemo(() => {
    try {
      const sp = new URLSearchParams(window.location.search);
      return {
        mode: sp.get('mode'),
        gasUrl: sp.get('gasUrl') || '',
      };
    } catch {
      return { mode: null, gasUrl: '' };
    }
  }, []);

  const isForcedStudentMode = urlParams.mode === 'student';

  const [gasUrl, setGasUrl] = useState(() => {
    if (urlParams.gasUrl) {
      try {
        window.localStorage.setItem(GAS_URL_STORAGE_KEY, urlParams.gasUrl);
      } catch {}
      return urlParams.gasUrl;
    }
    try {
      return window.localStorage.getItem(GAS_URL_STORAGE_KEY) || '';
    } catch {
      return '';
    }
  });
  const [gasUrlInput, setGasUrlInput] = useState(gasUrl);
  const [isSyncingCloud, setIsSyncingCloud] = useState(false);
  const [lastSyncTime, setLastSyncTime] = useState(null);

  const [teacherPasscode, setTeacherPasscode] = useState(() => {
    try {
      const saved = window.localStorage.getItem(PASSCODE_STORAGE_KEY);
      return saved !== null ? saved : '105';
    } catch {
      return '105';
    }
  });
  const [passcodeDraft, setPasscodeDraft] = useState(teacherPasscode);
  const [showPasscodeModal, setShowPasscodeModal] = useState(false);
  const [passcodeAttempt, setPasscodeAttempt] = useState('');
  const [passcodeError, setPasscodeError] = useState('');

  const [activeView, setActiveView] = useState(() => {
    if (urlParams.mode === 'teacher') return 'teacher';
    return 'student';
  });

  const [teacherTab, setTeacherTab] = useState('manage');

  const [bookmarks, setBookmarks] = useState(() => {
    try {
      const saved = window.localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {
      console.warn('localStorage read skipped:', e);
    }
    return INITIAL_BOOKMARKS;
  });

  useEffect(() => {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
    } catch (e) {
      console.warn('localStorage write skipped:', e);
    }
  }, [bookmarks]);

  const [toast, setToast] = useState(null);
  const showToast = useCallback((message, type = 'success') => {
    setToast({ message, type, id: Date.now() });
    setTimeout(() => {
      setToast((prev) => (prev && Date.now() - prev.id >= 3300 ? null : prev));
    }, 3500);
  }, []);

  const pullBookmarksFromGoogleSheets = useCallback(
    async (targetUrl = gasUrl, silent = false) => {
      const cleanUrl = (targetUrl || '').trim();
      if (!cleanUrl) {
        if (!silent) showToast('請先輸入 Google Apps Script 網頁應用程式網址。', 'error');
        return;
      }
      setIsSyncingCloud(true);
      try {
        const sep = cleanUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${cleanUrl}${sep}_t=${Date.now()}`, {
          method: 'GET',
          redirect: 'follow',
        });
        const data = await res.json();
        if (data.status === 'ok' && Array.isArray(data.bookmarks)) {
          setBookmarks((prev) => {
            const map = new Map();
            prev.forEach((item) => map.set(item.id, item));
            data.bookmarks.forEach((remote) => {
              const existing = map.get(remote.id);
              map.set(remote.id, {
                ...(existing || {}),
                ...remote,
                originalImage: existing?.originalImage || remote.imageDataUrl || '',
              });
            });
            return Array.from(map.values()).sort(
              (a, b) => (b.createdAt || 0) - (a.createdAt || 0)
            );
          });
          setLastSyncTime(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
          if (!silent) {
            showToast(`已成功從 Google 試算表同步 ${data.bookmarks.length} 筆投稿資料！`);
          }
        } else {
          if (!silent) {
            showToast(`試算表回傳異常：${data.message || '請確認部署權限設為「所有人」'}`, 'error');
          }
        }
      } catch {
        if (!silent) {
          showToast('無法連線至 Google Apps Script，請檢查網址是否以 /exec 結尾。', 'error');
        }
      } finally {
        setIsSyncingCloud(false);
      }
    },
    [gasUrl, showToast]
  );

  useEffect(() => {
    if (activeView === 'teacher' && gasUrl) {
      pullBookmarksFromGoogleSheets(gasUrl, true);
    }
  }, [activeView, gasUrl, pullBookmarksFromGoogleSheets]);

  const handleEnterTeacherView = () => {
    if (!teacherPasscode) {
      setActiveView('teacher');
      return;
    }
    setPasscodeAttempt('');
    setPasscodeError('');
    setShowPasscodeModal(true);
  };

  const handleVerifyPasscode = (e) => {
    e.preventDefault();
    if (passcodeAttempt.trim() === teacherPasscode) {
      setShowPasscodeModal(false);
      setActiveView('teacher');
      showToast('已驗證進入教師管理與 A4 拼版列印後台。');
    } else {
      setPasscodeError('驗證碼不正確，請重新輸入（預設驗證碼為 105）。');
    }
  };

  // ==========================================================================
  // 學生創作表單狀態與互動邏輯
  // ==========================================================================

    studentInfo: '高二3班 林宇軒',

    customZoneName: '',
    landmarkLabel: '竹園岡・紅磚門',
    mapCoords: { x: 43.2, y: 72.8 },
    sideAText: '晨光穿過竹園岡鳳凰木梢，紅磚校門見證無數少年奔跑身影，百五年風華正寫進我們的青春。',
    visualMode: 'blank-sketch',
    dotGrid: true,
    originalImage: '',
    woodcutImage: '',
    oilPaintingImage: '',
    watercolorImage: '',
    mosaicImage: '',
    interviewee: '伯父',
    sideBText:
      '伯父三十年前也是南一中校友，他笑著回憶當年大家總愛在勝利路買完熱騰騰的豆漿與燒餅，再趕在鐘響前衝進紅磚門。紅樓走廊上的微風、黑板上的粉筆灰，以及社團課後在鳳凰樹下暢談理想的午後，至今仍是家族聚會最愛聊的青春往事。他常說竹園岡教會他的不只是課本知識，更是面對挑戰時沉著堅毅的骨氣；當年師長在講臺上的諄諄教誨與同窗並肩奮鬥的情誼，早已化為一生受用無窮的力量。這份跨越三十載的處世家風，也深深勉勵我在百年名校裡踏實築夢，把南一中人的熱情與擔當代代傳承下去。',

  const sideACharCount = Array.from(studentForm.sideAText || '').length;
  const sideBCharCount = Array.from(studentForm.sideBText || '').length;

  const handleStudentZoneChange = (newZoneName) => {
    const zoneObj = LOCATION_ZONES.find((z) => z.name === newZoneName);
    setStudentForm((prev) => ({
      ...prev,
      locationZone: newZoneName,
      mapCoords: zoneObj ? { ...zoneObj.coords } : prev.mapCoords,
      landmarkLabel:
        zoneObj && !zoneObj.isCustom ? `${zoneObj.shortName}・` : prev.landmarkLabel,
    }));
    if (zoneObj?.targetStage) {
      setStudentMapZoomStage(zoneObj.targetStage);
    }
    setIsZoneDropdownOpen(false);
  };

  const handleStudentMapRefresh = useCallback(async () => {
    if (gasUrl && gasUrl.trim()) {
      await pullBookmarksFromGoogleSheets(gasUrl, true);
    }
    if (selectedZoneMeta?.targetStage) {
      setStudentMapZoomStage(selectedZoneMeta.targetStage);
    }
    showToast('已更新記憶足跡地圖並重新對焦目前座標！');
  }, [gasUrl, pullBookmarksFromGoogleSheets, selectedZoneMeta, showToast]);

  const handleStudentImageUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setIsProcessingFilters(true);
    try {
      const compressed = await compressImageFile(file, 640, 0.88);
      const variants = await generateAllPhotoFilters(compressed);
      setStudentForm((prev) => ({
        ...prev,
        visualMode: 'original',
        originalImage: variants.original,
        woodcutImage: variants.woodcut,
        oilPaintingImage: variants.oilPainting,
        watercolorImage: variants.watercolor,
        mosaicImage: variants.mosaic,
      }));
      setPreviewSide('A');
      showToast('已切換至「照片原圖」正面預覽，並同步生成 5 種相片藝術質感縮圖！');
    } catch {
      showToast('照片讀取失敗，請改選其他圖片檔案。', 'error');
    } finally {
      setIsProcessingFilters(false);
      if (e.target) {
        e.target.value = '';
      }
    }
  };

  const handleLoadDemoPhoto = async () => {
    setIsProcessingFilters(true);
    try {
      const demoDataUrl = createSampleTainanArchitectureDataUrl();
      const variants = await generateAllPhotoFilters(demoDataUrl);
      setStudentForm((prev) => ({
        ...prev,
        visualMode: 'original',
        originalImage: variants.original,
        woodcutImage: variants.woodcut,
        oilPaintingImage: variants.oilPainting,
        watercolorImage: variants.watercolor,
        mosaicImage: variants.mosaic,
      }));
      setPreviewSide('A');
      showToast('已載入府城紅磚廟埕範例照（照片原圖），點擊下方縮圖可切換 5 種相片質感！');
    } finally {
      setIsProcessingFilters(false);
    }
  };

  const handleStudentResetToBlank = () => {
    setStudentForm({
      studentInfo: '',
      locationZone: '臺南・府城舊城區',
      customZoneName: '',
      landmarkLabel: '府城・孔廟',
      mapCoords: { x: 42.1, y: 72.8 },
      sideAText: '',
      visualMode: 'blank-sketch',
      dotGrid: true,
      originalImage: '',
      woodcutImage: '',
      oilPaintingImage: '',
      watercolorImage: '',
      mosaicImage: '',
      interviewee: '',
      sideBText: '',
    });
    setStudentMapZoomStage('fucheng');
    setPreviewSide('A');
    setSubmittedEntry(null);
    showToast('已清空表單，可開始創作全新記憶書籤。');
  };

  const buildValidatedStudentEntry = () => {
    if (!studentForm.studentInfo.trim()) {
      showToast('請填寫「班級與座號／姓名」後再送出。', 'error');
      return null;
    }
    if (
      studentForm.locationZone === '其他／自訂地點' &&
      !studentForm.customZoneName.trim()
    ) {
      showToast('選擇「其他／自訂地點」時，請填寫自訂家鄉／城市名稱。', 'error');
      return null;
    }
    if (!studentForm.sideAText.trim()) {
      showToast('請填寫「正面題字・府城或家鄉印象」短文。', 'error');
      return null;
    }
    if (sideACharCount > 50) {
      showToast('正面題字超過 50 字上限，請適度精簡字句。', 'error');
      return null;
    }
    if (sideBCharCount > 300) {
      showToast('背面尺素超過 300 字上限，請適度精簡以完整呈現故事。', 'error');
      return null;
    }

    const hasPhoto = studentForm.visualMode !== 'blank-sketch';
    const rawActiveImg = hasPhoto ? resolveActiveBookmarkImage(studentForm) : '';

    return {
      id: `bm-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      studentInfo: studentForm.studentInfo.trim(),
      locationZone: studentForm.locationZone,
      customZoneName:
        studentForm.locationZone === '其他／自訂地點'
          ? studentForm.customZoneName.trim()
          : '',
      landmarkLabel:
        studentForm.landmarkLabel.trim() ||
        studentForm.customZoneName.trim() ||
        studentForm.locationZone,
      mapCoords: studentForm.mapCoords || TNFSH_ANCHOR,
      sideAText: studentForm.sideAText.trim(),
      visualMode: studentForm.visualMode,
      dotGrid: Boolean(studentForm.dotGrid),
      originalImage: hasPhoto ? studentForm.originalImage : '',
      woodcutImage: hasPhoto ? studentForm.woodcutImage : '',
      oilPaintingImage: hasPhoto ? studentForm.oilPaintingImage : '',
      watercolorImage: hasPhoto ? studentForm.watercolorImage : '',
      mosaicImage: hasPhoto ? studentForm.mosaicImage : '',
      imageDataUrl: rawActiveImg,
      interviewee: studentForm.interviewee.trim(),
      sideBText: studentForm.sideBText.trim(),
      createdAt: Date.now(),
    };
  };

  const handleStudentSubmit = async (e) => {
    e.preventDefault();
    const newEntry = buildValidatedStudentEntry();
    if (!newEntry) return;

    setIsSubmitting(true);
    try {
      const dedupKey = `${newEntry.studentInfo}::${newEntry.sideAText}`;
      let finalEntry = newEntry;

      setBookmarks((prev) => {
        const existingIdx = prev.findIndex(
          (item) =>
            `${(item.studentInfo || '').trim()}::${(item.sideAText || '').trim()}` === dedupKey
        );
        if (existingIdx >= 0) {
          finalEntry = { ...newEntry, id: prev[existingIdx].id };
          const updated = [...prev];
          updated[existingIdx] = finalEntry;
          return updated;
        }
        return [newEntry, ...prev];
      });

      let cloudSynced = false;
      if (gasUrl && gasUrl.trim()) {
        const sheetSafeImg = await shrinkDataUrlForGoogleSheets(finalEntry.imageDataUrl);
        const cloudResult = await postToGoogleAppsScript(gasUrl, {
          action: 'upsert',
          bookmark: {
            ...finalEntry,
            imageDataUrl: sheetSafeImg,
          },
        });
        cloudSynced = cloudResult.ok;
      }

      setSubmittedEntry({ ...finalEntry, cloudSynced });
      showToast(
        cloudSynced
          ? `已確認送出「${finalEntry.studentInfo}」的記憶書籤並同步至 Google 試算表！`
          : `已確認送出「${finalEntry.studentInfo}」的記憶書籤作品！`
      );
    } finally {
      setIsSubmitting(false);
    }
  };

  const VISUAL_MODES = [
    { id: 'original', label: '照片原圖' },
    { id: 'woodcut', label: '復古木刻版畫' },
    { id: 'oil-painting', label: '印象厚塗油畫' },
    { id: 'watercolor', label: '溫潤水彩暈染' },
    { id: 'mosaic', label: '復古馬賽克拼貼' },
    { id: 'blank-sketch', label: '留白手繪框' },
  ];

  const PHOTO_TEXTURE_THUMBNAILS = useMemo(
    () => [
      { id: 'original', label: '照片原圖', src: studentForm.originalImage },
      { id: 'woodcut', label: '復古木刻版畫', src: studentForm.woodcutImage },
      { id: 'oil-painting', label: '印象厚塗油畫', src: studentForm.oilPaintingImage },
      { id: 'watercolor', label: '溫潤水彩暈染', src: studentForm.watercolorImage },
      { id: 'mosaic', label: '復古馬賽克拼貼', src: studentForm.mosaicImage },
    ],
    [
      studentForm.originalImage,
      studentForm.woodcutImage,
      studentForm.oilPaintingImage,
      studentForm.watercolorImage,
      studentForm.mosaicImage,
    ]
  );

  // ==========================================================================
  // 教師後台管理、編輯修正、200 DPI 雙面 PDF 輸出與 A4 雙面拼版列印狀態
  // ==========================================================================
  const [searchQuery, setSearchQuery] = useState('');
  const [filterZone, setFilterZone] = useState('ALL');
  const [editingBookmark, setEditingBookmark] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  const [selectedPrintIds, setSelectedPrintIds] = useState(() =>
    INITIAL_BOOKMARKS.slice(0, 4).map((b) => b.id)
  );
  const [printPreviewSide, setPrintPreviewSide] = useState('front');
  const [showCropMarks, setShowCropMarks] = useState(true);
  const [activePrintPageIndex, setActivePrintPageIndex] = useState(0);

  const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
  const [lastGeneratedPdfInfo, setLastGeneratedPdfInfo] = useState(null);

  useEffect(() => {
    return () => {
      if (lastGeneratedPdfInfo?.blobUrl) {
        URL.revokeObjectURL(lastGeneratedPdfInfo.blobUrl);
      }
    };
  }, [lastGeneratedPdfInfo]);

  const filteredBookmarks = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return bookmarks.filter((bm) => {
      if (filterZone !== 'ALL' && bm.locationZone !== filterZone) return false;
      if (!q) return true;
      const hay = [
        bm.studentInfo,
        bm.locationZone,
        bm.customZoneName,
        bm.landmarkLabel,
        bm.interviewee,
        bm.sideAText,
        bm.sideBText,
      ]
        .filter(Boolean)
        .join(' ')
        .toLowerCase();
      return hay.includes(q);
    });
  }, [bookmarks, filterZone, searchQuery]);

  const togglePrintSelection = (id) => {
    setSelectedPrintIds((prev) =>
      prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
    );
  };

  const selectedPrintBookmarks = useMemo(() => {
    const map = new Map(bookmarks.map((b) => [b.id, b]));
    return selectedPrintIds.map((id) => map.get(id)).filter(Boolean);
  }, [bookmarks, selectedPrintIds]);

  const a4PrintPages = useMemo(() => {
    if (selectedPrintBookmarks.length === 0) return [[]];
    const pages = [];
    for (let i = 0; i < selectedPrintBookmarks.length; i += 4) {
      pages.push(selectedPrintBookmarks.slice(i, i + 4));
    }
    return pages;
  }, [selectedPrintBookmarks]);

  useEffect(() => {
    if (activePrintPageIndex >= a4PrintPages.length) {
      setActivePrintPageIndex(Math.max(0, a4PrintPages.length - 1));
    }
  }, [a4PrintPages.length, activePrintPageIndex]);

  const handleSortSelectedByNearestNeighbor = () => {
    if (selectedPrintBookmarks.length <= 1) {
      showToast('目前佇列至少需要 2 枚書籤才能進行地理鄰近排序。', 'error');
      return;
    }
    const sorted = sortBookmarksByNearestNeighbor(selectedPrintBookmarks);
    setSelectedPrintIds(sorted.map((b) => b.id));
    setActivePrintPageIndex(0);
    showToast(
      `已從「竹園岡・臺南一中」出發完成地理位置最鄰近排序，相鄰地標將優先編排於同一張 A4！`
    );
  };

  const handleExportStandardA4Pdf = async (openInNewTab = false) => {
    if (selectedPrintBookmarks.length === 0) {
      showToast('請先勾選至少 1 枚書籤再輸出 PDF。', 'error');
      return;
    }
    setIsGeneratingPdf(true);
    try {
      const result = await generateStandardA4DoubleSidedPdf(a4PrintPages, showCropMarks);
      const blobUrl = URL.createObjectURL(result.blob);

      setLastGeneratedPdfInfo((prev) => {
        if (prev?.blobUrl) {
          URL.revokeObjectURL(prev.blobUrl);
        }
        return {
          fileName: result.fileName,
          totalPages: result.totalPages,
          setCount: result.setCount,
          sizeMB: result.sizeMB,
          blobUrl,
        };
      });

      if (openInNewTab) {
        const openedWin = window.open(blobUrl, '_blank', 'noopener,noreferrer');
        if (!openedWin) {
          showToast(
            '瀏覽器已阻擋自動彈出視窗，請點擊下方資訊列中的「開啟新分頁預覽」按鈕。',
            'error'
          );
        } else {
          showToast(
            `已開啟 200 DPI 雙面 PDF 預覽（共 ${result.setCount} 組 / ${result.totalPages} 頁 A4 橫式）！`
          );
        }
      } else {
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = result.fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast(
          `已下載「${result.fileName}」（共 ${result.totalPages} 頁 A4 雙面，${result.sizeMB} MB）！`
        );
      }
    } catch (err) {
      console.error('PDF generation failed:', err);
      showToast('生成 200 DPI PDF 時發生錯誤，請稍後再試。', 'error');
    } finally {
      setIsGeneratingPdf(false);
    }
  };

  const handleSaveEditedBookmark = async (updatedBm) => {
    setBookmarks((prev) => prev.map((b) => (b.id === updatedBm.id ? updatedBm : b)));
    setEditingBookmark(null);
    showToast(`已儲存「${updatedBm.studentInfo}」的修正內容！`);

    if (gasUrl && gasUrl.trim()) {
      const sheetSafeImg = await shrinkDataUrlForGoogleSheets(updatedBm.imageDataUrl);
      await postToGoogleAppsScript(gasUrl, {
        action: 'upsert',
        bookmark: { ...updatedBm, imageDataUrl: sheetSafeImg },
      });
    }
  };

  const handleDeleteBookmark = async (id) => {
    setBookmarks((prev) => prev.filter((b) => b.id !== id));
    setSelectedPrintIds((prev) => prev.filter((item) => item !== id));
    setConfirmDeleteId(null);
    showToast('已刪除該筆書籤作品。');

    if (gasUrl && gasUrl.trim()) {
      await postToGoogleAppsScript(gasUrl, { action: 'delete', id });
    }
  };

  const handleSaveGasUrlSetting = (e) => {
    e.preventDefault();
    const trimmed = gasUrlInput.trim();
    setGasUrl(trimmed);
    try {
      window.localStorage.setItem(GAS_URL_STORAGE_KEY, trimmed);
    } catch {}
    showToast(
      trimmed
        ? '已儲存 Google Apps Script 連線網址！'
        : '已清除雲端連線網址（改為純本機模式）。'
    );
  };

  const handlePushAllToGoogleSheets = async () => {
    if (!gasUrl || !gasUrl.trim()) {
      showToast('請先輸入並儲存 Google Apps Script 網址。', 'error');
      return;
    }
    setIsSyncingCloud(true);
    try {
      const prepared = [];
      for (const bm of bookmarks) {
        const activeImg = resolveActiveBookmarkImage(bm);
        const safeImg = await shrinkDataUrlForGoogleSheets(activeImg);
        prepared.push({ ...bm, imageDataUrl: safeImg });
      }
      const res = await postToGoogleAppsScript(gasUrl, {
        action: 'syncAll',
        bookmarks: prepared,
      });
      if (res.ok) {
        setLastSyncTime(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
        showToast(`已將目前 ${prepared.length} 筆作品全部備份推送至 Google 試算表！`);
      } else {
        showToast('推送至試算表時發生錯誤，請檢查 Apps Script 部署權限。', 'error');
      }
    } finally {
      setIsSyncingCloud(false);
    }
  };

  const handleTriggerA4Print = (side) => {
    setPrintPreviewSide(side);
    setTimeout(() => {
      window.print();
    }, 120);
  };

  const googleSitesEmbedUrls = useMemo(() => {
    let baseUrl = 'https://your-site-domain.example.com/';
    try {
      baseUrl = `${window.location.origin}${window.location.pathname}`;
    } catch {}
    const encodedGas =
      gasUrl && gasUrl.trim() ? `&gasUrl=${encodeURIComponent(gasUrl.trim())}` : '';
    return {
      studentUrl: `${baseUrl}?mode=student${encodedGas}`,
      teacherUrl: `${baseUrl}?mode=teacher${encodedGas}`,
    };
  }, [gasUrl]);

  const copyTextToClipboard = async (text, label) => {
    try {
      await navigator.clipboard.writeText(text);
      showToast(`已複製「${label}」至剪貼簿！`);
    } catch {
      showToast('複製失敗，請手動選取文字複製。', 'error');
    }
  };

  const statsSummary = useMemo(() => {
    let tainanCount = 0;
    let outerCount = 0;
    bookmarks.forEach((bm) => {
      const z = LOCATION_ZONES.find((item) => item.name === bm.locationZone);
      if (z?.isTainan) tainanCount++;
      else outerCount++;
    });
    return {
      total: bookmarks.length,
      tainanCount,
      outerCount,
      selectedPrint: selectedPrintBookmarks.length,
    };
  }, [bookmarks, selectedPrintBookmarks.length]);

  return (
    <div className="min-h-screen bg-[#FAF8F5] text-[#262623] font-sans selection:bg-[#A63A2B] selection:text-[#FAF8F5]">
      <style>{`
        .font-serif {
          font-family: 'Noto Serif TC', 'Songti TC', 'Kaiti TC', 'DFKai-SB', Georgia, serif;
        }
        .font-sans {
          font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .cotton-paper-bg {
          background-color: #FAF8F5;
          background-image: radial-gradient(rgba(166, 58, 43, 0.035) 1px, transparent 0),
                            radial-gradient(rgba(197, 155, 39, 0.04) 1px, transparent 0);
          background-size: 24px 24px;
          background-position: 0 0, 12px 12px;
        }

        @media screen {
          .print-only-container {
            display: none !important;
          }
        }

        @media print {
          @page {
            size: A4 landscape;
            margin: 0;
          }
          html, body {
            width: 297mm;
            height: 210mm;
            margin: 0 !important;
            padding: 0 !important;
            background: #FAF8F5 !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }
          .no-print {
            display: none !important;
          }
          .print-only-container {
            display: block !important;
            width: 297mm;
            margin: 0;
            padding: 0;
          }
          .print-a4-page {
            width: 297mm !important;
            height: 210mm !important;
            page-break-after: always;
            break-after: page;
            box-shadow: none !important;
            border: none !important;
          }
          .print-a4-page:last-child {
            page-break-after: auto;
            break-after: auto;
          }
        }
      `}</style>

      {/* 列印專用隱藏容器 */}
      <div className="print-only-container" aria-hidden="true">
        {a4PrintPages.map((pageSlots, idx) => (
          <A4ImpositionSheet
            key={`print-sheet-${printPreviewSide}-${idx}`}
            slots={pageSlots}
            side={printPreviewSide}
            showCropMarks={showCropMarks}
            isPrintRender={true}
          />
        ))}
      </div>

      {/* 全域操作提示 Toast */}
      {toast && (
        <div className="no-print fixed bottom-5 right-5 z-50 max-w-md">
          <div
            className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border font-medium text-sm ${
              toast.type === 'error'
                ? 'bg-[#FFF5F3] border-[#A63A2B] text-[#A63A2B]'
                : 'bg-[#262623] border-[#C59B27] text-[#FAF8F5]'
            }`}
          >
            {toast.type === 'error' ? (
              <AlertCircle className="w-5 h-5 shrink-0 text-[#A63A2B]" />
            ) : (
              <CheckCircle2 className="w-5 h-5 shrink-0 text-[#E5C89B]" />
            )}
            <span>{toast.message}</span>
          </div>
        </div>
      )}

      {/* 教師後台驗證碼彈窗（預設 105） */}
      {showPasscodeModal && (
        <div className="no-print fixed inset-0 z-50 bg-[#262623]/60 backdrop-blur-xs flex items-center justify-center p-4">
          <form
            onSubmit={handleVerifyPasscode}
            className="bg-[#FAF8F5] border border-[#D8D0C5] rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-4"
          >
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2 text-[#A63A2B]">
                <Lock className="w-5 h-5" />
                <h3 className="font-serif font-bold text-base text-[#262623]">
                  進入教師管理與列印後台
                </h3>
              </div>
              <button
                type="button"
                onClick={() => setShowPasscodeModal(false)}
                className="p-1 rounded-lg hover:bg-[#F4F0E8] text-[#6E6259] cursor-pointer"
              >
                <X className="w-4 h-4" />
              </button>
            </div>
            <p className="text-xs text-[#5C524B] leading-relaxed">
              請輸入教師後台驗證碼（校慶預設驗證碼為 <strong className="text-[#A63A2B]">105</strong>，進入後可自訂或設為免驗證碼）。
            </p>
            <div>
              <input
                type="password"
                value={passcodeAttempt}
                onChange={(e) => setPasscodeAttempt(e.target.value)}
                placeholder="請輸入驗證碼（預設 105）"
                autoFocus
                className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8D0C5] bg-[#FFFDF9] text-sm focus:outline-none focus:border-[#A63A2B]"
              />
              {passcodeError && (
                <p className="text-xs text-[#A63A2B] mt-1.5 font-medium">{passcodeError}</p>
              )}
            </div>
            <div className="flex items-center justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={() => setShowPasscodeModal(false)}
                className="px-4 py-2 rounded-xl border border-[#D8D0C5] text-xs font-medium text-[#5C524B] cursor-pointer"
              >
                取消
              </button>
              <button
                type="submit"
                className="px-5 py-2 rounded-xl bg-[#A63A2B] hover:bg-[#872D21] text-[#FAF8F5] text-xs font-serif font-bold cursor-pointer"
              >
                確認進入
              </button>
            </div>
          </form>
        </div>
      )}

      {/* 教師修正編輯 Modal */}
      {editingBookmark && (
        <div className="no-print">
          <TeacherEditModal
            bookmark={editingBookmark}
            allBookmarks={bookmarks}
            onClose={() => setEditingBookmark(null)}
            onSave={handleSaveEditedBookmark}
          />
        </div>

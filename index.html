            <div className="space-y-5">
              {/* 控制與 200 DPI 標準 A4 雙面 PDF 輸出工具列 */}
              <div className="bg-[#FAF8F5] border border-[#D8D0C5] rounded-2xl p-4 sm:p-5 shadow-xs space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h3 className="font-serif font-bold text-base text-[#262623]">
                      標準 A4 橫式雙面四連排拼版（297mm × 210mm ｜ 200 DPI PDF 輸出）
                    </h3>
                    <p className="text-xs text-[#5C524B] mt-0.5">
                      單枚書籤精準尺寸 <strong>74.25mm × 210mm</strong>。輸出 PDF 時，<strong>奇數頁</strong>為正面 <code>[1][2][3][4]</code>，<strong>偶數頁</strong>已自動鏡像重排為 <code>[4][3][2][1]</code>，印表機設定「雙面列印（短邊翻轉／Flip on Short Edge）」即可正反零誤差對齊！
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-[#D8D0C5] bg-[#F4F0E8] text-xs font-serif text-[#262623] cursor-pointer">
                      <input
                        type="checkbox"
                        checked={showCropMarks}
                        onChange={(e) => setShowCropMarks(e.target.checked)}
                        className="accent-[#A63A2B]"
                      />
                      <span>顯示裁切對位十字與虛線</span>
                    </label>

                    <button
                      type="button"
                      onClick={handleSortSelectedByNearestNeighbor}
                      disabled={selectedPrintBookmarks.length <= 1}
                      title="以「竹園岡・臺南一中」為起點，依地理位置最鄰近演算法自動排序，讓相鄰地標排在同一張 A4"
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-[#C59B27] bg-[#FFFDF7] hover:bg-[#F7EFE0] disabled:opacity-50 text-xs font-serif font-semibold text-[#7A5424] cursor-pointer transition-colors"
                    >
                      <Sparkles className="w-3.5 h-3.5 text-[#C59B27]" />
                      <span>依地理位置鄰近自動同頁排序</span>
                    </button>

                    <div className="inline-flex rounded-xl bg-[#F4F0E8] p-1 border border-[#D8D0C5]">
                      <button
                        type="button"
                        onClick={() => setPrintPreviewSide('front')}
                        className={`px-3 py-1 rounded-lg text-xs font-serif font-semibold cursor-pointer ${
                          printPreviewSide === 'front'
                            ? 'bg-[#A63A2B] text-[#FAF8F5]'
                            : 'text-[#5C524B]'
                        }`}
                      >
                        檢視奇數頁：正面 [1-2-3-4]
                      </button>
                      <button
                        type="button"
                        onClick={() => setPrintPreviewSide('back')}
                        className={`px-3 py-1 rounded-lg text-xs font-serif font-semibold cursor-pointer ${
                          printPreviewSide === 'back'
                            ? 'bg-[#2F5738] text-[#FAF8F5]'
                            : 'text-[#5C524B]'
                        }`}
                      >
                        檢視偶數頁：鏡像背面 [4-3-2-1]
                      </button>
                    </div>
                  </div>
                </div>

                {/* 核心行動按鈕區：200 DPI 標準 A4 雙面 PDF 下載、新分頁檢視與直接列印 */}
                <div className="pt-3 border-t border-[#EAE2D3] flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-serif text-[#5C524B]">切換拼版組別：</span>
                    {a4PrintPages.map((_, pIdx) => (
                      <button
                        key={`page-btn-${pIdx}`}
                        type="button"
                        onClick={() => setActivePrintPageIndex(pIdx)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-serif font-bold border cursor-pointer ${
                          activePrintPageIndex === pIdx
                            ? 'bg-[#262623] text-[#FAF8F5] border-[#262623]'
                            : 'bg-[#FAF8F5] text-[#5C524B] border-[#D8D0C5]'
                        }`}
                      >
                        第 {pIdx + 1} 組（P.{pIdx * 2 + 1}～{pIdx * 2 + 2}）
                      </button>
                    ))}
                  </div>

                  <div className="flex flex-wrap items-center gap-2.5">
                    <button
                      type="button"
                      onClick={() => handleExportStandardA4Pdf(false)}
                      disabled={isGeneratingPdf || selectedPrintBookmarks.length === 0}
                      className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-[#A63A2B] hover:bg-[#872D21] disabled:opacity-60 text-[#FAF8F5] text-xs font-serif font-bold shadow-sm cursor-pointer transition-colors"
                    >
                      <Download className="w-4 h-4" />
                      <span>
                        {isGeneratingPdf
                          ? '正在封裝 200 DPI 雙面 PDF...'
                          : `下載標準 A4 雙面 PDF（共 ${a4PrintPages.length * 2} 頁）`}
                      </span>
                    </button>

                    <button
                      type="button"
                      onClick={() => handleExportStandardA4Pdf(true)}
                      disabled={isGeneratingPdf || selectedPrintBookmarks.length === 0}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#2F5738] hover:bg-[#23432A] disabled:opacity-60 text-[#FAF8F5] text-xs font-serif font-bold shadow-sm cursor-pointer transition-colors"
                    >
                      <ExternalLink className="w-3.5 h-3.5" />
                      <span>新分頁開啟 PDF 檢視</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => handleTriggerA4Print('front')}
                      className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border border-[#D8D0C5] bg-[#FAF8F5] hover:bg-[#EAE1D2] text-xs font-serif font-semibold text-[#5C524B] cursor-pointer"
                    >
                      <Printer className="w-3.5 h-3.5" />
                      <span>瀏覽器單面列印正面</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => handleTriggerA4Print('back')}
                      className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border border-[#D8D0C5] bg-[#FAF8F5] hover:bg-[#EAE1D2] text-xs font-serif font-semibold text-[#5C524B] cursor-pointer"
                    >
                      <ArrowLeftRight className="w-3.5 h-3.5" />
                      <span>瀏覽器單面列印背面</span>
                    </button>
                  </div>
                </div>

                {/* 最近一次生成之 200 DPI PDF 檔案下載與新分頁開啟資訊橫幅 */}
                {lastGeneratedPdfInfo && (
                  <div className="p-3.5 rounded-xl bg-[#E6EFE8] border border-[#2F5738]/40 flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-2.5 text-xs text-[#262623]">
                      <FileText className="w-4 h-4 text-[#2F5738] shrink-0" />
                      <div>
                        <div className="font-serif font-bold text-[#2F5738]">
                          已就緒：{lastGeneratedPdfInfo.fileName}
                        </div>
                        <div className="text-[11px] text-[#4E5A50]">
                          解析度：200 DPI（2339 × 1654 px）｜ 規格：A4 橫式 297 × 210 mm ｜ 共{' '}
                          {lastGeneratedPdfInfo.setCount} 組（{lastGeneratedPdfInfo.totalPages} 頁雙面）｜ 檔案大小{' '}
                          {lastGeneratedPdfInfo.sizeMB} MB
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <a
                        href={lastGeneratedPdfInfo.blobUrl}
                        download={lastGeneratedPdfInfo.fileName}
                        className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-[#A63A2B] hover:bg-[#872D21] text-[#FAF8F5] text-xs font-serif font-bold"
                      >
                        <Download className="w-3.5 h-3.5" />
                        <span>再次下載 PDF</span>
                      </a>
                      <a
                        href={lastGeneratedPdfInfo.blobUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-[#2F5738] hover:bg-[#23432A] text-[#FAF8F5] text-xs font-serif font-bold"
                      >
                        <ExternalLink className="w-3.5 h-3.5" />
                        <span>開啟新分頁預覽</span>
                      </a>
                    </div>
                  </div>
                )}
              </div>

              {/* A4 橫式 1:1 比例拼版預覽畫布 */}
              <div className="bg-[#E5DEC9]/70 border border-[#D8D0C5] rounded-2xl p-4 sm:p-6 overflow-x-auto flex flex-col items-center">
                <div className="mb-3 flex items-center gap-2 text-xs font-serif text-[#5C524B]">
                  <span
                    className={`px-2.5 py-0.5 rounded-full font-bold ${
                      printPreviewSide === 'front'
                        ? 'bg-[#A63A2B] text-[#FAF8F5]'
                        : 'bg-[#2F5738] text-[#FAF8F5]'
                    }`}
                  >
                    {printPreviewSide === 'front'
                      ? `第 ${activePrintPageIndex * 2 + 1} 頁（奇數頁・正面）：由左至右 1 → 2 → 3 → 4`
                      : `第 ${activePrintPageIndex * 2 + 2} 頁（偶數頁・鏡像背面）：由左至右 4 → 3 → 2 → 1（短邊翻轉完全對齊）`}
                  </span>
                </div>

                <div className="inline-block">
                  <A4ImpositionSheet
                    slots={a4PrintPages[activePrintPageIndex] || []}
                    side={printPreviewSide}
                    showCropMarks={showCropMarks}
                    isPrintRender={false}
                  />
                </div>
              </div>
            </div>
          )}

          {/* -------------------------------------------------------------- */}
          {/* 子分頁 3：Google 協作平台 & Google 試算表雙向連動精靈              */}
          {/* -------------------------------------------------------------- */}
          {teacherTab === 'google-sync' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-6 space-y-5">
                {/* 步驟一：貼上 GAS 網址 */}
                <form
                  onSubmit={handleSaveGasUrlSetting}
                  className="bg-[#FAF8F5] border border-[#D8D0C5] rounded-2xl p-5 shadow-xs space-y-4"
                >
                  <div className="flex items-center gap-2 border-b border-[#EAE2D3] pb-2.5">
                    <Cloud className="w-5 h-5 text-[#A63A2B]" />
                    <h3 className="font-serif font-bold text-base text-[#262623]">
                      步驟一：連結 Google 試算表資料庫
                    </h3>
                  </div>
                  <p className="text-xs text-[#5C524B] leading-relaxed">
                    將右側提供的 <strong>Google Apps Script (Code.gs)</strong> 部署為網頁應用程式後，把產生的 <code>https://script.google.com/macros/s/.../exec</code> 網址貼入下方並儲存，全校學生在 Google 協作平台填寫的書籤就會自動彙整到您的 Google 試算表中！
                  </p>
                  <div>
                    <label className="block text-xs font-semibold text-[#262623] mb-1">
                      Google Apps Script 網頁應用程式網址（/exec）
                    </label>
                    <input
                      type="url"
                      value={gasUrlInput}
                      onChange={(e) => setGasUrlInput(e.target.value)}
                      placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-[#D8D0C5] bg-[#FFFDF9] text-xs font-mono focus:outline-none focus:border-[#A63A2B]"
                    />
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      type="submit"
                      className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-[#A63A2B] hover:bg-[#872D21] text-[#FAF8F5] text-xs font-serif font-bold cursor-pointer"
                    >
                      <Check className="w-3.5 h-3.5" />
                      <span>儲存試算表連線網址</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => pullBookmarksFromGoogleSheets(gasUrlInput, false)}
                      disabled={!gasUrlInput.trim() || isSyncingCloud}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-[#D8D0C5] bg-[#F4F0E8] hover:bg-[#EAE1D2] disabled:opacity-50 text-xs font-serif font-semibold text-[#262623] cursor-pointer"
                    >
                      <RefreshCw
                        className={`w-3.5 h-3.5 ${isSyncingCloud ? 'animate-spin' : ''}`}
                      />
                      <span>測試拉取試算表資料</span>
                    </button>
                    <button
                      type="button"
                      onClick={handlePushAllToGoogleSheets}
                      disabled={!gasUrlInput.trim() || isSyncingCloud}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-[#2F5738]/40 bg-[#E6EFE8] hover:bg-[#D6E5D9] disabled:opacity-50 text-xs font-serif font-semibold text-[#2F5738] cursor-pointer"
                    >
                      <Upload className="w-3.5 h-3.5" />
                      <span>將現有作品備份推送至試算表</span>
                    </button>
                  </div>
                </form>

                {/* 步驟二：Google 協作平台雙分頁內嵌網址 */}
                <div className="bg-[#FAF8F5] border border-[#D8D0C5] rounded-2xl p-5 shadow-xs space-y-4">
                  <div className="flex items-center gap-2 border-b border-[#EAE2D3] pb-2.5">
                    <ExternalLink className="w-5 h-5 text-[#2F5738]" />
                    <h3 className="font-serif font-bold text-base text-[#262623]">
                      步驟二：Google 協作平台（Google Sites）雙分頁內嵌網址
                    </h3>
                  </div>
                  <p className="text-xs text-[#5C524B] leading-relaxed">
                    在 Google 協作平台建立兩個頁面，分別使用「<strong>插入 → 內嵌 → 透過網址</strong>」貼上以下對應連結（已自動夾帶試算表同步參數）：
                  </p>

                  <div className="space-y-3">
                    <div className="p-3 rounded-xl bg-[#F4F0E8] border border-[#D8D0C5] space-y-1.5">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-serif font-bold text-[#A63A2B]">
                          ① 學生投稿頁面專用網址（隱藏後台按鈕，純淨創作介面）
                        </span>
                        <button
                          type="button"
                          onClick={() =>
                            copyTextToClipboard(
                              googleSitesEmbedUrls.studentUrl,
                              '學生投稿頁面內嵌網址'
                            )
                          }
                          className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-[#A63A2B] text-[#FAF8F5] text-[11px] font-bold cursor-pointer"
                        >
                          <Copy className="w-3 h-3" />
                          <span>複製網址</span>
                        </button>
                      </div>
                      <div className="p-2 rounded bg-[#FFFDF9] border border-[#D8D0C5] text-[11px] font-mono text-[#262623] break-all">
                        {googleSitesEmbedUrls.studentUrl}
                      </div>
                    </div>

                    <div className="p-3 rounded-xl bg-[#F4F0E8] border border-[#D8D0C5] space-y-1.5">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-serif font-bold text-[#2F5738]">
                          ② 教師管理與列印頁面專用網址（直接開啟後台彙整與 A4 拼版）
                        </span>
                        <button
                          type="button"
                          onClick={() =>
                            copyTextToClipboard(
                              googleSitesEmbedUrls.teacherUrl,
                              '教師後台頁面內嵌網址'
                            )
                          }
                          className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-[#2F5738] text-[#FAF8F5] text-[11px] font-bold cursor-pointer"
                        >
                          <Copy className="w-3 h-3" />
                          <span>複製網址</span>
                        </button>
                      </div>
                      <div className="p-2 rounded bg-[#FFFDF9] border border-[#D8D0C5] text-[11px] font-mono text-[#262623] break-all">
                        {googleSitesEmbedUrls.teacherUrl}
                      </div>
                    </div>
                  </div>
                </div>

                {/* 教師後台驗證碼設定 */}
                <div className="bg-[#FAF8F5] border border-[#D8D0C5] rounded-2xl p-5 shadow-xs space-y-3">
                  <div className="flex items-center gap-2">
                    {teacherPasscode ? (
                      <Lock className="w-4 h-4 text-[#A63A2B]" />
                    ) : (
                      <Unlock className="w-4 h-4 text-[#2F5738]" />
                    )}
                    <h4 className="font-serif font-bold text-sm text-[#262623]">
                      教師後台進入驗證碼設定（目前：{teacherPasscode || '免驗證碼'}）
                    </h4>
                  </div>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={passcodeDraft}
                      onChange={(e) => setPasscodeDraft(e.target.value)}
                      placeholder="輸入新驗證碼（留空則免驗證碼）"
                      className="flex-1 px-3 py-2 rounded-xl border border-[#D8D0C5] bg-[#FFFDF9] text-xs"
                    />
                    <button
                      type="button"
                      onClick={() => {
                        const val = passcodeDraft.trim();
                        setTeacherPasscode(val);
                        try {
                          window.localStorage.setItem(PASSCODE_STORAGE_KEY, val);
                        } catch {}
                        showToast(
                          val
                            ? `已更新教師後台驗證碼為「${val}」`
                            : '已取消教師後台驗證碼限制'
                        );
                      }}
                      className="px-4 py-2 rounded-xl bg-[#262623] text-[#FAF8F5] text-xs font-serif font-semibold cursor-pointer"
                    >
                      更新驗證碼
                    </button>
                  </div>
                </div>
              </div>

              {/* 右側：完整 Google Apps Script (Code.gs) 程式碼複製區 */}
              <div className="lg:col-span-6 bg-[#FAF8F5] border border-[#D8D0C5] rounded-2xl p-5 shadow-xs flex flex-col justify-between space-y-3">
                <div className="flex items-center justify-between border-b border-[#EAE2D3] pb-2.5">
                  <div>
                    <h3 className="font-serif font-bold text-base text-[#262623]">
                      Google 試算表後端程式碼（Code.gs）
                    </h3>
                    <p className="text-xs text-[#6E6259]">
                      開啟 Google 試算表 →「擴充功能 → Apps Script」全選貼上並部署為網頁應用程式
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      copyTextToClipboard(
                        GOOGLE_APPS_SCRIPT_CODE,
                        'Google Apps Script (Code.gs) 完整程式碼'
                      )
                    }
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#A63A2B] hover:bg-[#872D21] text-[#FAF8F5] text-xs font-serif font-bold shadow-xs cursor-pointer shrink-0"
                  >
                    <Copy className="w-3.5 h-3.5" />
                    <span>一鍵複製全部程式碼</span>
                  </button>
                </div>

                <pre className="flex-1 max-h-[520px] overflow-auto p-3.5 rounded-xl bg-[#262623] text-[#F4F0E8] text-[11px] font-mono leading-relaxed select-all">
                  {GOOGLE_APPS_SCRIPT_CODE}
                </pre>
              </div>
            </div>
          )}
        </main>
      )}
    </div>
  );
}


    // Mount React 18 Root
    const rootContainer = document.getElementById('root');
    const root = ReactDOM.createRoot(rootContainer);
    root.render(<App />);
  </script>
</body>
</html>
